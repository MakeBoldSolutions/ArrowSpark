name: Azure Static Web Apps CI/CD

# The only workflow that deploys the ArrowSpark showcase to Azure Static Web Apps.
# Azure generated this file when the Static Web App was linked to the repository; it is kept
# under its generated name and job names, but builds the site itself: the Godot Web export and
# the Astro build must run before upload, so the deploy action uploads the prebuilt web/dist
# and skips its own build. Each same-repository pull request to main gets a preview
# environment, closed when the pull request closes; main deploys production.

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches:
      - main
  workflow_dispatch:
  schedule:
    # Daily production load check; does nothing unless SYNTHETIC_DAILY is 'true' (learning window only).
    - cron: '17 13 * * *'

permissions:
  contents: read
  pull-requests: write # the deploy action comments the preview URL on the pull request

jobs:
  build_and_deploy_job:
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') || (github.event_name == 'pull_request' && github.event.action != 'closed')
    runs-on: ubuntu-latest
    name: Build and Deploy Job
    env:
      GODOT_VERSION: "4.4-stable"
      GODOT_DIR: ${{ github.workspace }}/../godot
    outputs:
      url: ${{ steps.builddeploy.outputs.static_web_app_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          lfs: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Cache Godot ${{ env.GODOT_VERSION }} editor and Web templates
        id: godot-cache
        uses: actions/cache@v4
        with:
          path: ${{ env.GODOT_DIR }}
          key: godot-${{ env.GODOT_VERSION }}-linux-web-v1

      - name: Download and verify Godot ${{ env.GODOT_VERSION }} (SHA-512)
        if: steps.godot-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p "$GODOT_DIR" && cd "$GODOT_DIR"
          BASE="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}"
          EDITOR="Godot_v${GODOT_VERSION}_linux.x86_64.zip"
          TEMPLATES="Godot_v${GODOT_VERSION}_export_templates.tpz"
          curl -fsSL -o SHA512-SUMS.txt "$BASE/SHA512-SUMS.txt"
          curl -fsSL -o "$EDITOR" "$BASE/$EDITOR"
          curl -fsSL -o "$TEMPLATES" "$BASE/$TEMPLATES"
          grep -F " ${EDITOR}" SHA512-SUMS.txt | sha512sum --check --strict -
          grep -F " ${TEMPLATES}" SHA512-SUMS.txt | sha512sum --check --strict -
          unzip -q "$EDITOR"
          mkdir -p templates
          unzip -q -j "$TEMPLATES" templates/web_nothreads_release.zip templates/version.txt -d templates
          rm "$EDITOR" "$TEMPLATES"

      - name: Install Godot templates
        run: |
          VERSION_DIR="$(cat "$GODOT_DIR/templates/version.txt")"
          mkdir -p "$HOME/.local/share/godot/export_templates/$VERSION_DIR"
          cp "$GODOT_DIR/templates/"* "$HOME/.local/share/godot/export_templates/$VERSION_DIR/"
          chmod +x "$GODOT_DIR/Godot_v${GODOT_VERSION}_linux.x86_64"
          echo "GODOT_BIN=$GODOT_DIR/Godot_v${GODOT_VERSION}_linux.x86_64" >> "$GITHUB_ENV"

      - name: Run puzzle rule, layout, and solvability regressions
        run: python tests/run_puzzle_regressions.py --godot "$GODOT_BIN"

      - name: Run save/settings and input regressions
        run: python tests/run_regressions.py --godot "$GODOT_BIN"

      # Godot 4.4 can report spurious autoload parse errors when a project that already has a
      # .godot cache is imported again, so validate a fresh copy without one.
      - name: Validate project (editor import, fresh copy)
        run: |
          mkdir -p ../validate
          tar --exclude=./.godot --exclude=./.git --exclude=./web -cf - . | tar -xf - -C ../validate
          # Godot 4.4 on headless Linux parses scripts during the first import of a fresh
          # copy, before autoloads are registered, so the first launch only builds the cache.
          "$GODOT_BIN" --headless --path ../validate --editor --quit > editor-import.log 2>&1 || true
          "$GODOT_BIN" --headless --path ../validate --editor --quit 2>&1 | tee editor.log
          # Known, pre-existing template quirk on this platform (not seen on Windows): the
          # template's opening.gd reports the SceneLoader autoload as undeclared. Allow exactly
          # those sites; any other script error fails the build.
          ALLOWED='at: GDScript::reload \(res://(addons/maaacks_game_template/base/scenes/opening/opening\.gd:(18|20|22|98)|scenes/opening/opening\.gd:1)\)'
          total=$(grep -c "SCRIPT ERROR" editor.log || true)
          allowed=$(grep -A1 "SCRIPT ERROR" editor.log | grep -cE "$ALLOWED" || true)
          echo "Script errors: $total (known template quirk: $allowed)"
          if [ "$total" != "$allowed" ]; then
            grep -A1 "SCRIPT ERROR" editor.log | grep -vE -- "$ALLOWED" | grep -v -- '^--$'
            exit 1
          fi

      - name: Export the game for the Web
        run: |
          BUILD="$(node web/scripts/export-game.mjs --godot "$GODOT_BIN" | tail -n 1)"
          echo "PUBLIC_GAME_BUILD=$BUILD" >> "$GITHUB_ENV"

      - name: Install site dependencies
        working-directory: web
        run: npm ci

      - name: Audit site dependencies
        working-directory: web
        run: npm audit --audit-level=high

      - name: Check site
        working-directory: web
        run: npm run check

      - name: Build site
        working-directory: web
        env:
          PUBLIC_REACTIONS_URL: ${{ vars.PUBLIC_REACTIONS_URL }}
        run: npm run build

      - name: Synthetic load check (local build)
        working-directory: web
        run: |
          npx playwright install --with-deps chromium
          npx astro preview --port 4321 &
          for i in $(seq 1 60); do curl -fsS -o /dev/null http://localhost:4321/ && break; sleep 1; done
          set +e
          node scripts/synthetic-check.mjs http://localhost:4321
          code=$?
          set -e
          if [ "$code" = "3" ]; then
            echo "::warning::Synthetic check inconclusive (no WebGL2 in this runner); not an outage."
          elif [ "$code" != "0" ]; then
            exit "$code"
          fi

      # Fork pull requests have no access to the deploy token, so they build and check only.
      # A manual run only builds: the deploy action would treat it as a production deploy.
      - name: Build And Deploy
        id: builddeploy
        if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_GREEN_BAY_09BDC1010 }}
          repo_token: ${{ secrets.GITHUB_TOKEN }} # Used for Github integrations (i.e. PR comments)
          action: "upload"
          ###### Repository/Build Configurations ######
          # The site is built above (Godot export + Astro), so upload web/dist as-is.
          app_location: "web/dist" # Prebuilt site
          api_location: "" # No API in this repository
          output_location: ""
          skip_app_build: true
          skip_api_build: true
          ###### End of Repository/Build Configurations ######

  # One synthetic load check against the deployment that was just made. A failure blocks the PR;
  # "inconclusive" (no WebGL2 in the runner) is a warning naming the cause, never an outage.
  synthetic_preview_job:
    needs: build_and_deploy_job
    if: needs.build_and_deploy_job.outputs.url != ''
    runs-on: ubuntu-latest
    name: Synthetic Check (deployment)
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Synthetic load check
        working-directory: web
        env:
          TARGET_URL: ${{ needs.build_and_deploy_job.outputs.url }}
        run: |
          npm ci
          npx playwright install --with-deps chromium
          set +e
          node scripts/synthetic-check.mjs "$TARGET_URL"
          code=$?
          set -e
          if [ "$code" = "3" ]; then
            echo "::warning::Synthetic check inconclusive on $TARGET_URL: no WebGL2 in this runner (software WebGL backend unavailable). Not an outage."
          elif [ "$code" != "0" ]; then
            exit "$code"
          fi

  close_pull_request_job:
    if: github.event_name == 'pull_request' && github.event.action == 'closed' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    name: Close Pull Request Job
    steps:
      - name: Close Pull Request
        id: closepullrequest
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_GREEN_BAY_09BDC1010 }}
          action: "close"

  # Daily check of production during the learning window only (repository variable SYNTHETIC_DAILY).
  synthetic_daily_job:
    if: github.event_name == 'schedule' && vars.SYNTHETIC_DAILY == 'true'
    runs-on: ubuntu-latest
    name: Synthetic Check (production, daily)
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Synthetic load check (production)
        working-directory: web
        run: |
          npm ci
          npx playwright install --with-deps chromium
          set +e
          node scripts/synthetic-check.mjs https://arrow.makeboldspark.com
          code=$?
          set -e
          if [ "$code" = "3" ]; then
            echo "::warning::Synthetic check inconclusive: no WebGL2 in this runner. Not an outage."
          elif [ "$code" != "0" ]; then
            exit "$code"
          fi
